[package]
name = "rust_engine_3d"
version = "0.1.0"
authors = ["ubuntunux <ubuntunux@gmail.com>"]
license = "BSD 2-Clause"
homepage = "https://github.com/ubuntunux/RustEngine3D"
repository = "https://github.com/ubuntunux/RustEngine3D"
readme = "README.md"
edition = "2024"

[dependencies]
ash = { version = "0.38.0", default-features = false, features = ["linked", "debug", "std"] }
ash-window = "0.13"
bincode = "1.3"
bitflags = "2.13"
byteorder = "1.5"
chrono = "0.4"
env_logger = "0.11"
gltf = { version = "1.4", features = ["extras", "names", "import"] }
image = "0.25"
log = "0.4"
nalgebra = {version = "0.35", features = ["serde-serialize"]}
nalgebra-glm = "0.21"
rand = "0.10"
regex = "1.12"
rusttype = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdl2 = { version = "0.38", features = ["mixer"] }
strum = "0.28"
strum_macros = "0.28"
winit = { version = "0.30.13", features = ["rwh_06"] }
which = "8.0"
xml-rs = "1.0"
uuid = { version = "1.29", features = ["v4", "v7", "fast-rng", "serde"] }
bymsdfgen-core = "0.1.1"
bymsdfgen-io = "0.1.1"
ttf-parser = "0.25.1"

[lib]
crate-type = ["lib", "cdylib"]

[[example]]
name = "example"
path = "examples/example.rs"
